name: CloudOps CI and delivery

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Gitea 1.25 does not enforce this field. No deployment secrets are used.
permissions:
  contents: read

jobs:
  validate:
    name: Validate and package pilot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDOPS_VALIDATION_DIR: local/ci
      CHROMIUM_PATH: /nonexistent/cloudops-chromium
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      # Node 20 actions are compatible with the existing Gitea act_runner.
      - name: Check out the mirrored commit
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: https://github.com/actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          # A Gitea job token cannot authenticate to GitHub's download API.
          token: ''

      - name: Create an isolated Python environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install development dependencies
        run: python -m pip install -e '.[test,automation,browser-test]' build==1.6.1

      - name: Validate source and run unit tests
        run: |
          node --check web/app.js
          sh -n bin/cloudops-host
          python tools/validate.py --report local/ci/local-checks.json

      - name: Check Ansible syntax without running operations
        run: bash tools/check-ansible.sh

      - name: Install a checksum-verified Compose validator
        run: |
          mkdir -p local/ci/bin
          cd local/ci/bin
          asset="docker-compose-linux-$(uname -m)"
          base=https://github.com/docker/compose/releases/download/v5.5.1
          curl --fail --silent --show-error --location "$base/$asset" -o "$asset"
          curl --fail --silent --show-error --location "$base/$asset.sha256" -o "$asset.sha256"
          sha256sum --check "$asset.sha256"
          chmod +x "$asset"
          ln -s "$asset" docker-compose

      - name: Validate example Compose configurations
        run: |
          local/ci/bin/docker-compose -f examples/rendered/manager.compose.yaml config --quiet
          local/ci/bin/docker-compose -f examples/rendered/nextcloud.compose.yaml config --quiet

      - name: Install Chromium and browser dependencies
        run: python -m playwright install --with-deps chromium

      - name: Test browser flows against the local simulated API
        run: python tools/browser_smoke.py

      - name: Build and smoke-test the Python wheel
        run: |
          python -m build --outdir local/ci/dist
          wheel_env="$(mktemp -d "${RUNNER_TEMP:-/tmp}/cloudops-wheel-XXXXXX")"
          trap 'rm -rf -- "$wheel_env"' EXIT
          python -m venv "$wheel_env"
          "$wheel_env/bin/python" -m pip install local/ci/dist/*.whl
          cd "$wheel_env"
          "$wheel_env/bin/cloudctl" --help
          "$wheel_env/bin/cloudctl" providers

      - name: Package the complete installable source
        run: bash tools/package-source.sh

      # Use the legacy protocol supported by this server/runner combination.
      - name: Deliver validated packages and reports
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: homelab-cloudops-${{ github.sha }}
          path: |
            local/ci/dist/
            local/ci/local-checks.json
            local/ci/browser-checks.json
          if-no-files-found: error
          retention-days: 7

      - name: Download the delivered artifact again
        uses: https://github.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: homelab-cloudops-${{ github.sha }}
          path: local/ci/downloaded

      - name: Verify the downloaded source package
        run: |
          cd local/ci/downloaded/dist
          sha256sum --check homelab-cloudops-source-*.tar.gz.sha256
          python - <<'PY'
          from pathlib import Path
          import tarfile

          archive = next(Path('.').glob('homelab-cloudops-source-*.tar.gz'))
          with tarfile.open(archive) as source:
              names = set(source.getnames())
          required = {'homelab-cloudops/' + name for name in (
              'install.sh', 'web/app.js', 'pyproject.toml', 'PRIORITIES.md',
              'ansible/playbooks/operation.yml', 'semaphore/bridge.py')}
          assert required <= names, required - names
          print('Downloaded source package contains the installer and runtime assets.')
          PY
